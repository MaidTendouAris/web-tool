<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据单位转换</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #18202b;
      --muted: #667085;
      --line: #d9dee7;
      --soft: #eef2f7;
      --blue: #2563eb;
      --green: #0f8f70;
      --amber: #b76e00;
      --danger: #c2410c;
      --ring: rgba(37, 99, 235, .18);
      --shadow: 0 10px 28px rgba(24, 32, 43, .08);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #05070d;
      --panel: #0d111a;
      --text: #f4f7fb;
      --muted: #96a1b3;
      --line: #202938;
      --soft: #111722;
      --blue: #8ab4ff;
      --green: #57d8b5;
      --amber: #f0b45b;
      --danger: #ff8a66;
      --ring: rgba(138, 180, 255, .22);
      --shadow: 0 18px 46px rgba(0, 0, 0, .55);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button, input, select {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 20px 0 44px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 52px;
    }

    .home, .icon-btn, .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      transition: border-color .16s ease, background .16s ease, color .16s ease;
    }

    .home {
      min-height: 36px;
      padding: 7px 10px;
      color: var(--muted);
      font-weight: 700;
    }

    .home:hover, .icon-btn:hover, .copy-btn:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .icon-btn {
      width: 36px;
      height: 36px;
    }

    .top-actions {
      display: inline-flex;
      gap: 10px;
      align-items: center;
    }

    .language {
      display: inline-flex;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--panel) 86%, transparent);
    }

    .language button {
      min-height: 30px;
      padding: 5px 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-weight: 700;
    }

    .language button.active {
      background: var(--panel);
      color: var(--blue);
      box-shadow: 0 1px 5px rgba(24, 32, 43, .1);
    }

    .version-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--panel) 86%, transparent);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      margin: 20px 0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .mode-tabs {
      display: inline-flex;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }

    .mode-tabs button {
      min-height: 34px;
      border: 0;
      border-radius: 6px;
      padding: 6px 12px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }

    .mode-tabs button.active {
      background: var(--panel);
      color: var(--blue);
      box-shadow: 0 1px 5px rgba(24, 32, 43, .1);
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .converter {
      padding: 20px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(150px, .6fr);
      gap: 12px;
      align-items: end;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--panel);
      color: var(--text);
      outline: 0;
    }

    input:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px var(--ring);
    }

    .settings {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .standard {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .standard button, .preset button {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 10px;
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
    }

    .standard button.active {
      border-color: var(--green);
      color: var(--green);
      background: color-mix(in srgb, var(--green) 12%, transparent);
    }

    .preset {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .preset button:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 16px 0;
    }

    .summary-item {
      min-height: 88px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      padding: 13px;
    }

    .summary-item strong {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .summary-item span {
      display: block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: clamp(16px, 2.2vw, 22px);
      font-weight: 800;
      word-break: break-word;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .result {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      min-height: 76px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: var(--panel);
    }

    .result.current {
      border-color: var(--blue);
      box-shadow: inset 4px 0 0 var(--blue);
    }

    .unit {
      font-weight: 800;
      margin-bottom: 2px;
    }

    .unit-full {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .value {
      margin-top: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-weight: 800;
      word-break: break-all;
    }

    .copy-btn {
      width: 36px;
      height: 36px;
      color: var(--muted);
    }

    .note {
      margin-top: 14px;
      padding: 13px 14px;
      border-left: 4px solid var(--amber);
      border-radius: 8px;
      background: color-mix(in srgb, var(--amber) 10%, var(--panel));
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      border-radius: 999px;
      padding: 8px 12px;
      color: #fff;
      background: rgba(24, 32, 43, .9);
      transition: opacity .18s ease, transform .18s ease;
      font-size: 13px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%);
    }

    @media (max-width: 760px) {
      .shell { width: min(100% - 24px, 1080px); }
      .hero, .input-grid { grid-template-columns: 1fr; }
      .summary, .results { grid-template-columns: 1fr; }
      .mode-tabs { width: 100%; }
      .mode-tabs button { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar" aria-label="页面导航">
      <a class="home" href="../index.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        <span id="homeText">工具集</span>
      </a>
      <div class="top-actions">
        <span class="version-badge">V1.0.0</span>
        <div class="language" aria-label="Language">
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button class="icon-btn" id="themeButton" type="button" title="切换主题" aria-label="切换主题">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 7.5A8.5 8.5 0 1 1 12 3Z"></path></svg>
        </button>
      </div>
    </nav>

    <section class="hero">
      <div>
        <h1>数据单位转换</h1>
        <p class="lead">实时换算网络速率与数据容量，清楚区分 bit、Byte、1000 进制和 1024 进制。</p>
      </div>
      <div class="mode-tabs" role="tablist" aria-label="换算类型">
        <button class="active" type="button" data-mode="rate">传输速率</button>
        <button type="button" data-mode="storage">数据容量</button>
      </div>
    </section>

    <section class="panel converter">
      <div class="input-grid">
        <label>
          数值
          <input id="valueInput" inputmode="decimal" autocomplete="off" value="100" aria-label="输入数值">
        </label>
        <label>
          单位
          <select id="unitSelect" aria-label="选择单位"></select>
        </label>
      </div>

      <div class="settings">
        <div class="standard" id="storageStandard" hidden>
          <span>容量标准</span>
          <button type="button" class="active" data-standard="binary">1024 进制</button>
          <button type="button" data-standard="decimal">1000 进制</button>
        </div>
        <div class="preset" id="presets" aria-label="常用数值"></div>
      </div>

      <div class="summary" aria-label="重点结果">
        <div class="summary-item">
          <strong id="summaryLabelA">下载速度</strong>
          <span id="summaryA">-</span>
        </div>
        <div class="summary-item">
          <strong id="summaryLabelB">每分钟传输</strong>
          <span id="summaryB">-</span>
        </div>
        <div class="summary-item">
          <strong id="summaryLabelC">每小时传输</strong>
          <span id="summaryC">-</span>
        </div>
      </div>

      <div class="results" id="results" aria-live="polite"></div>
      <div class="note" id="note"></div>
    </section>
  </main>

  <div class="toast" id="toast">已复制</div>

  <script src="./real-time-data-unit-converter.js"></script>
</body>
</html>
