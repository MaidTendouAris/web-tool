<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据单位转换</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("web-tools-theme") || localStorage.getItem("web-tool-theme");
        var theme = saved === "dark" || saved === "light"
          ? saved
          : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
    })();
  </script>
  <style>
    .input-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(150px, .6fr);
      gap: 12px;
      align-items: end;
    }

    .settings {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .standard {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .standard button, .preset button {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 10px;
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
    }

    .standard button.active {
      border-color: var(--green);
      color: var(--green);
      background: color-mix(in srgb, var(--green) 12%, transparent);
    }

    .preset {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .preset button:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .summary {
      margin: 16px 0;
    }

    .summary-item {
      min-height: 88px;
    }

    .summary-item span {
      display: block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: clamp(16px, 2.2vw, 22px);
      font-weight: 800;
      word-break: break-word;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .result {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      min-height: 76px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: var(--panel);
    }

    .result.current {
      border-color: var(--blue);
      box-shadow: inset 4px 0 0 var(--blue);
    }

    .unit {
      font-weight: 800;
      margin-bottom: 2px;
    }

    .unit-full {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .value {
      margin-top: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-weight: 800;
      word-break: break-all;
    }

    .note {
      margin-top: 14px;
      padding: 13px 14px;
      border-left: 4px solid var(--amber);
      border-radius: 8px;
      background: color-mix(in srgb, var(--amber) 10%, var(--panel));
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      border-radius: 999px;
      padding: 8px 12px;
      color: #fff;
      background: rgba(24, 32, 43, .9);
      transition: opacity .18s ease, transform .18s ease;
      font-size: 13px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%);
    }

    @media (max-width: 760px) {
      .input-grid, .results { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="../shared-controls.css">
</head>
<body class="wt-tool-page wt-tool-page--compact">
  <main class="shell">
    <nav class="topbar" aria-label="页面导航">
      <a class="home" href="../index.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        <span id="homeText">工具集</span>
      </a>
      <div class="top-actions wt-top-actions">
        <span class="version-badge">V1.0.0</span>
        <div class="language" aria-label="Language">
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button class="icon-btn" id="themeButton" type="button" title="切换主题" aria-label="切换主题">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 7.5A8.5 8.5 0 1 1 12 3Z"></path></svg>
        </button>
      </div>
    </nav>

    <section class="hero">
      <div>
        <h1>数据单位转换</h1>
        <p class="lead">实时换算网络速率与数据容量，清楚区分 bit、Byte、1000 进制和 1024 进制。</p>
      </div>
      <div class="mode-tabs" role="tablist" aria-label="换算类型">
        <button class="active" type="button" data-mode="rate">传输速率</button>
        <button type="button" data-mode="storage">数据容量</button>
      </div>
    </section>

    <section class="panel converter">
      <div class="input-grid">
        <label>
          数值
          <input id="valueInput" inputmode="decimal" autocomplete="off" value="100" aria-label="输入数值">
        </label>
        <label>
          单位
          <select id="unitSelect" aria-label="选择单位"></select>
        </label>
      </div>

      <div class="settings">
        <div class="standard" id="storageStandard" hidden>
          <span>容量标准</span>
          <button type="button" class="active" data-standard="binary">1024 进制</button>
          <button type="button" data-standard="decimal">1000 进制</button>
        </div>
        <div class="preset" id="presets" aria-label="常用数值"></div>
      </div>

      <div class="summary" aria-label="重点结果">
        <div class="summary-item">
          <strong id="summaryLabelA">下载速度</strong>
          <span id="summaryA">-</span>
        </div>
        <div class="summary-item">
          <strong id="summaryLabelB">每分钟传输</strong>
          <span id="summaryB">-</span>
        </div>
        <div class="summary-item">
          <strong id="summaryLabelC">每小时传输</strong>
          <span id="summaryC">-</span>
        </div>
      </div>

      <div class="results" id="results" aria-live="polite"></div>
      <div class="note" id="note"></div>
    </section>
  </main>

  <div class="toast" id="toast">已复制</div>

  <script src="../shared-controls.js"></script>
  <script src="./real-time-data-unit-converter.js"></script>
</body>
</html>
