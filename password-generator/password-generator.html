<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>密码生成器</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("web-tools-theme") || localStorage.getItem("web-tool-theme");
        var theme = saved === "dark" || saved === "light"
          ? saved
          : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
    })();
  </script>
  <style>
    .settings-grid { display: grid; gap: 14px; }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .checks { display: grid; gap: 9px; }
    .check {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }
    .passphrase-settings[hidden], .password-settings[hidden] { display: none; }
    .privacy { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .strength {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }
    .strength-head { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; font-weight: 800; }
    .strength-meter { height: 8px; border-radius: 999px; background: var(--panel); overflow: hidden; border: 1px solid var(--line); }
    .strength-fill { width: 0%; height: 100%; background: var(--danger); transition: width .18s ease, background .18s ease; }
    .result-list { display: grid; gap: 10px; }
    .result {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      min-height: 64px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .secret {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 800;
      word-break: break-all;
    }
    .empty { min-height: 120px; display: grid; place-items: center; color: var(--muted); background: var(--soft); border: 1px dashed var(--line); border-radius: 8px; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      border-radius: 999px;
      padding: 8px 12px;
      color: #fff;
      background: rgba(24, 32, 43, .9);
      transition: opacity .18s ease, transform .18s ease;
      font-size: 13px;
    }
    .toast.show { opacity: 1; transform: translateX(-50%); }
    @media (max-width: 820px) {
      .field-grid { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="../shared-controls.css">
</head>
<body class="wt-tool-page">
  <main class="shell">
    <nav class="topbar" aria-label="页面导航" id="navLabel">
      <a class="home" href="../index.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        <span id="homeText">工具集</span>
      </a>
      <div class="top-actions wt-top-actions">
        <span class="version-badge">V1.0.0</span>
        <div class="language" aria-label="Language">
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button class="icon-btn" id="themeButton" type="button" title="切换主题" aria-label="切换主题">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 7.5A8.5 8.5 0 1 1 12 3Z"></path></svg>
        </button>
      </div>
    </nav>

    <section class="hero">
      <div>
        <h1 id="pageTitle">密码生成器</h1>
        <p class="lead" id="leadText">使用浏览器本地随机数生成密码或密码短语；结果不会上传，也不会被保存。</p>
      </div>
      <div class="mode-tabs" role="tablist" aria-label="生成模式" id="modeTabs">
        <button class="active" type="button" data-mode="password">密码</button>
        <button type="button" data-mode="passphrase">密码短语</button>
      </div>
    </section>

    <section class="workspace">
      <section class="panel" aria-labelledby="settingsTitle">
        <h2 id="settingsTitle">生成设置</h2>
        <div class="settings-grid">
          <div class="field-grid">
            <label>
              <span id="lengthLabel">长度</span>
              <input id="lengthInput" type="number" min="4" max="128" value="20">
            </label>
            <label>
              <span id="countLabel">生成数量</span>
              <input id="countInput" type="number" min="1" max="20" value="5">
            </label>
          </div>
          <label class="password-settings">
            <span id="lengthSliderLabel">快速调整长度</span>
            <input id="lengthSlider" type="range" min="4" max="128" value="20">
          </label>
          <div class="password-settings checks" id="passwordOptions">
            <label class="check"><span id="upperLabel">包含大写字母</span><input id="upperInput" type="checkbox" checked></label>
            <label class="check"><span id="lowerLabel">包含小写字母</span><input id="lowerInput" type="checkbox" checked></label>
            <label class="check"><span id="numberLabel">包含数字</span><input id="numberInput" type="checkbox" checked></label>
            <label class="check"><span id="symbolLabel">包含符号</span><input id="symbolInput" type="checkbox"></label>
            <label class="check"><span id="similarLabel">排除相似字符 O/0/I/l</span><input id="similarInput" type="checkbox" checked></label>
          </div>
          <div class="passphrase-settings" hidden>
            <div class="field-grid">
              <label>
                <span id="wordCountLabel">单词数量</span>
                <input id="wordCountInput" type="number" min="3" max="8" value="4">
              </label>
              <label>
                <span id="separatorLabel">分隔符</span>
                <select id="separatorInput">
                  <option value="-">-</option>
                  <option value="_">_</option>
                  <option value=".">.</option>
                  <option value=" ">空格</option>
                  <option value="">无分隔符</option>
                </select>
              </label>
            </div>
          </div>
          <div class="actions">
            <button class="btn primary" id="generateButton" type="button">生成</button>
            <button class="btn" id="copyAllButton" type="button">复制全部</button>
          </div>
          <p class="privacy" id="privacyText">所有生成过程都在当前浏览器中完成；本工具不会上传、保存或记录生成的密码。</p>
        </div>
      </section>

      <section class="panel" aria-labelledby="resultsTitle">
        <h2 id="resultsTitle">生成结果</h2>
        <div class="strength" aria-live="polite">
          <div class="strength-head">
            <span id="strengthLabel">强度提示</span>
            <strong id="strengthText">尚未生成</strong>
          </div>
          <div class="strength-meter" aria-hidden="true"><div class="strength-fill" id="strengthFill"></div></div>
        </div>
        <div class="result-list" id="resultList">
          <div class="empty" id="emptyText">点击生成开始。</div>
        </div>
      </section>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="../shared-controls.js"></script>
  <script src="./password-generator.js"></script>
</body>
</html>
