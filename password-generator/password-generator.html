<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>密码生成器</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("web-tools-theme") || localStorage.getItem("web-tool-theme");
        var theme = saved === "dark" || saved === "light"
          ? saved
          : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #18202b;
      --muted: #667085;
      --line: #d9dee7;
      --soft: #eef2f7;
      --blue: #2563eb;
      --green: #0f8f70;
      --amber: #b76e00;
      --danger: #c2410c;
      --ring: rgba(37, 99, 235, .18);
      --shadow: 0 10px 28px rgba(24, 32, 43, .08);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #05070d;
      --panel: #0d111a;
      --text: #f4f7fb;
      --muted: #96a1b3;
      --line: #202938;
      --soft: #111722;
      --blue: #8ab4ff;
      --green: #57d8b5;
      --amber: #f0b45b;
      --danger: #ff8a66;
      --ring: rgba(138, 180, 255, .22);
      --shadow: 0 18px 46px rgba(0, 0, 0, .55);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    button, input, select { font: inherit; }
    a { color: inherit; text-decoration: none; }
    svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }
    .shell { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 20px 0 44px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 52px; }
    .home, .btn, .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
      transition: border-color .16s ease, color .16s ease, background .16s ease;
    }
    .home { min-height: 36px; padding: 7px 10px; color: var(--muted); }
    .btn { min-height: 40px; padding: 9px 13px; }
    .btn.primary { border-color: var(--blue); background: var(--blue); color: #fff; }
    :root[data-theme="dark"] .btn.primary { color: #07111f; }
    .home:hover, .btn:hover, .icon-btn:hover { border-color: var(--blue); color: var(--blue); }
    .btn.primary:hover { color: #fff; }
    :root[data-theme="dark"] .btn.primary:hover { color: #07111f; }
    .icon-btn { width: 38px; height: 38px; color: var(--muted); }
    .top-actions { display: inline-flex; gap: 10px; align-items: center; }
    .language { display: inline-flex; padding: 4px; border: 1px solid var(--line); border-radius: 8px; background: color-mix(in srgb, var(--panel) 86%, transparent); }
    .language button {
      min-height: 30px;
      padding: 5px 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-weight: 700;
    }
    .language button.active { background: var(--panel); color: var(--blue); box-shadow: 0 1px 5px rgba(24, 32, 43, .1); }
    .version-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--panel) 86%, transparent);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      margin: 28px 0 18px;
    }
    h1 { margin: 0 0 8px; font-size: clamp(32px, 5vw, 50px); line-height: 1.05; letter-spacing: 0; }
    .lead { margin: 0; color: var(--muted); line-height: 1.65; }
    .mode-tabs { display: inline-flex; padding: 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
    .mode-tabs button {
      min-height: 34px;
      border: 0;
      border-radius: 6px;
      padding: 6px 12px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }
    .mode-tabs button.active { background: var(--panel); color: var(--blue); box-shadow: 0 1px 5px rgba(24, 32, 43, .1); }
    .workspace { display: grid; grid-template-columns: minmax(300px, .86fr) minmax(0, 1.14fr); gap: 14px; align-items: start; }
    .panel { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
    .panel h2 { margin: 0 0 14px; font-size: 18px; letter-spacing: 0; }
    .settings-grid { display: grid; gap: 14px; }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    label { display: grid; gap: 7px; color: var(--muted); font-size: 13px; font-weight: 700; }
    input, select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      background: var(--panel);
      color: var(--text);
      outline: 0;
    }
    input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 4px var(--ring); }
    input:disabled {
      color: var(--muted);
      background: var(--soft);
      cursor: not-allowed;
      opacity: .75;
    }
    input[type="range"] { min-height: 34px; padding: 0; accent-color: var(--blue); }
    .checks { display: grid; gap: 9px; }
    .check {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }
    .check input { width: 18px; min-height: 18px; accent-color: var(--blue); }
    .passphrase-settings[hidden], .password-settings[hidden] { display: none; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .privacy { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .strength {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }
    .strength-head { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; font-weight: 800; }
    .strength-meter { height: 8px; border-radius: 999px; background: var(--panel); overflow: hidden; border: 1px solid var(--line); }
    .strength-fill { width: 0%; height: 100%; background: var(--danger); transition: width .18s ease, background .18s ease; }
    .result-list { display: grid; gap: 10px; }
    .result {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      min-height: 64px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .secret {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 800;
      word-break: break-all;
    }
    .empty { min-height: 120px; display: grid; place-items: center; color: var(--muted); background: var(--soft); border: 1px dashed var(--line); border-radius: 8px; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      border-radius: 999px;
      padding: 8px 12px;
      color: #fff;
      background: rgba(24, 32, 43, .9);
      transition: opacity .18s ease, transform .18s ease;
      font-size: 13px;
    }
    .toast.show { opacity: 1; transform: translateX(-50%); }
    @media (max-width: 820px) {
      .shell { width: min(100% - 24px, 1120px); }
      .hero, .workspace, .field-grid { grid-template-columns: 1fr; }
      .mode-tabs { width: 100%; }
      .mode-tabs button { flex: 1; }
      .topbar { align-items: flex-start; }
      .top-actions { flex-wrap: wrap; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar" aria-label="页面导航" id="navLabel">
      <a class="home" href="../index.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        <span id="homeText">工具集</span>
      </a>
      <div class="top-actions">
        <span class="version-badge">V1.0.0</span>
        <div class="language" aria-label="Language">
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button class="icon-btn" id="themeButton" type="button" title="切换主题" aria-label="切换主题">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 7.5A8.5 8.5 0 1 1 12 3Z"></path></svg>
        </button>
      </div>
    </nav>

    <section class="hero">
      <div>
        <h1 id="pageTitle">密码生成器</h1>
        <p class="lead" id="leadText">使用浏览器本地随机数生成密码或密码短语；结果不会上传，也不会被保存。</p>
      </div>
      <div class="mode-tabs" role="tablist" aria-label="生成模式" id="modeTabs">
        <button class="active" type="button" data-mode="password">密码</button>
        <button type="button" data-mode="passphrase">密码短语</button>
      </div>
    </section>

    <section class="workspace">
      <section class="panel" aria-labelledby="settingsTitle">
        <h2 id="settingsTitle">生成设置</h2>
        <div class="settings-grid">
          <div class="field-grid">
            <label>
              <span id="lengthLabel">长度</span>
              <input id="lengthInput" type="number" min="4" max="128" value="20">
            </label>
            <label>
              <span id="countLabel">生成数量</span>
              <input id="countInput" type="number" min="1" max="20" value="5">
            </label>
          </div>
          <label class="password-settings">
            <span id="lengthSliderLabel">快速调整长度</span>
            <input id="lengthSlider" type="range" min="4" max="128" value="20">
          </label>
          <div class="password-settings checks" id="passwordOptions">
            <label class="check"><span id="upperLabel">包含大写字母</span><input id="upperInput" type="checkbox" checked></label>
            <label class="check"><span id="lowerLabel">包含小写字母</span><input id="lowerInput" type="checkbox" checked></label>
            <label class="check"><span id="numberLabel">包含数字</span><input id="numberInput" type="checkbox" checked></label>
            <label class="check"><span id="symbolLabel">包含符号</span><input id="symbolInput" type="checkbox" checked></label>
            <label class="check"><span id="similarLabel">排除相似字符 O/0/I/l</span><input id="similarInput" type="checkbox"></label>
          </div>
          <div class="passphrase-settings" hidden>
            <div class="field-grid">
              <label>
                <span id="wordCountLabel">单词数量</span>
                <input id="wordCountInput" type="number" min="3" max="8" value="4">
              </label>
              <label>
                <span id="separatorLabel">分隔符</span>
                <select id="separatorInput">
                  <option value="-">-</option>
                  <option value="_">_</option>
                  <option value=".">.</option>
                  <option value=" ">空格</option>
                  <option value="">无分隔符</option>
                </select>
              </label>
            </div>
          </div>
          <div class="actions">
            <button class="btn primary" id="generateButton" type="button">生成</button>
            <button class="btn" id="copyAllButton" type="button">复制全部</button>
          </div>
          <p class="privacy" id="privacyText">所有生成过程都在当前浏览器中完成；本工具不会上传、保存或记录生成的密码。</p>
        </div>
      </section>

      <section class="panel" aria-labelledby="resultsTitle">
        <h2 id="resultsTitle">生成结果</h2>
        <div class="strength" aria-live="polite">
          <div class="strength-head">
            <span id="strengthLabel">强度提示</span>
            <strong id="strengthText">尚未生成</strong>
          </div>
          <div class="strength-meter" aria-hidden="true"><div class="strength-fill" id="strengthFill"></div></div>
        </div>
        <div class="result-list" id="resultList">
          <div class="empty" id="emptyText">点击生成开始。</div>
        </div>
      </section>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./password-generator.js"></script>
</body>
</html>
