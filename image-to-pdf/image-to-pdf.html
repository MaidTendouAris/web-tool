<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片转 PDF</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("web-tools-theme") || localStorage.getItem("web-tool-theme");
        var theme = saved === "dark" || saved === "light"
          ? saved
          : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #18202b;
      --muted: #667085;
      --line: #d9dee7;
      --soft: #eef2f7;
      --blue: #2563eb;
      --green: #0f8f70;
      --amber: #b76e00;
      --danger: #c2410c;
      --shadow: 0 10px 28px rgba(24, 32, 43, .08);
      --ring: rgba(37, 99, 235, .18);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #05070d;
      --panel: #0d111a;
      --text: #f4f7fb;
      --muted: #96a1b3;
      --line: #202938;
      --soft: #111722;
      --blue: #8ab4ff;
      --green: #57d8b5;
      --amber: #f0b45b;
      --danger: #ff8a66;
      --shadow: 0 18px 46px rgba(0, 0, 0, .55);
      --ring: rgba(138, 180, 255, .22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button, input, select { font: inherit; }
    a { color: inherit; text-decoration: none; }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 20px 0 44px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 52px;
    }

    .home, .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
    }

    .home {
      min-height: 36px;
      color: var(--muted);
    }

    .home:hover, .btn:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .btn.primary {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
    }

    :root[data-theme="dark"] .btn.primary { color: #07111f; }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .language {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .language button, .theme-button {
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      min-width: 36px;
      min-height: 30px;
      cursor: pointer;
      font-weight: 800;
    }

    .language button.active {
      background: var(--soft);
      color: var(--blue);
    }

    .theme-button {
      border: 1px solid var(--line);
      background: var(--panel);
      min-height: 38px;
      min-width: 40px;
    }

    .version-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 240px;
      gap: 22px;
      align-items: end;
      margin: 54px 0 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(36px, 5vw, 54px);
      line-height: 1.02;
      letter-spacing: 0;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }

    .engine-card, .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .engine-card {
      padding: 14px;
      display: grid;
      gap: 8px;
    }

    .engine-card strong { font-size: 13px; }
    .engine-card span { color: var(--muted); font-size: 13px; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, .95fr);
      gap: 14px;
    }

    .card {
      padding: 16px;
      min-width: 0;
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 18px;
      letter-spacing: 0;
    }

    .upload {
      display: grid;
      place-items: center;
      min-height: 138px;
      padding: 18px;
      border: 2px dashed var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      text-align: center;
      cursor: pointer;
    }

    .upload.dragover {
      border-color: var(--blue);
      background: var(--soft);
    }

    .upload strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 16px;
    }

    .upload input { display: none; }

    .image-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .image-item {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .image-item.dragging {
      opacity: .55;
    }

    .thumb {
      width: 82px;
      height: 62px;
      border-radius: 6px;
      background: var(--soft);
      object-fit: cover;
    }

    .file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 800;
    }

    .file-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .item-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
    }

    .icon-btn:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      background: var(--panel);
      color: var(--text);
      outline: 0;
    }

    input:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px var(--ring);
    }

    .status-line {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .resource-warning {
      margin-top: 14px;
      padding: 10px 12px;
      border-left: 4px solid var(--amber);
      border-radius: 8px;
      background: color-mix(in srgb, var(--amber) 12%, var(--panel));
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .summary div {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }

    .summary span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .result-box {
      display: grid;
      gap: 10px;
      min-height: 120px;
      align-content: start;
      color: var(--muted);
      line-height: 1.6;
    }

    .download-link {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--green);
      color: #fff;
      font-weight: 800;
    }

    :root[data-theme="dark"] .download-link { color: #04110d; }

    .log {
      min-height: 120px;
      max-height: 240px;
      overflow: auto;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }

    @media (max-width: 820px) {
      .hero, .workspace { grid-template-columns: 1fr; }
      .form-grid, .summary { grid-template-columns: 1fr; }
      .image-item { grid-template-columns: 70px minmax(0, 1fr); }
      .item-actions { grid-column: 1 / -1; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar" aria-label="页面导航" id="navLabel">
      <a class="home" href="../index.html">‹ <span id="homeLink">工具集</span></a>
      <div class="controls">
        <span class="version-badge">V1.0.0</span>
        <div class="language" aria-label="Language">
          <button class="active" type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button class="theme-button" id="themeButton" type="button" aria-label="切换主题">◐</button>
      </div>
    </nav>

    <section class="hero">
      <div>
        <h1 id="pageTitle">图片转 PDF</h1>
        <p class="lead" id="pageLead">将 JPG/PNG 图片按当前顺序合成为 PDF，所有处理都在浏览器本地完成。</p>
      </div>
      <div class="engine-card">
        <strong id="engineTitle">pdf-lib</strong>
        <span id="engineStatus">尚未加载</span>
        <button class="btn" id="loadPdfLibButton" type="button">加载本地库</button>
      </div>
    </section>

    <section class="workspace">
      <div class="card">
        <h2 id="inputTitle">输入图片</h2>
        <label class="upload" id="uploadLabel">
          <input id="fileInput" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" multiple>
          <span>
            <strong id="uploadTitle">选择或拖放 JPG/PNG 图片</strong>
            <span id="uploadHint">支持多选；拖拽列表项可调整 PDF 页面顺序。</span>
          </span>
        </label>
        <div class="image-list" id="imageList"></div>
        <div class="resource-warning" id="resourceWarning">需要先在入口页资源管理中导入或下载 pdf-lib.min.js 到浏览器缓存。进入本页后仍需点击“加载本地库”或在生成时自动加载。</div>
      </div>

      <div class="card">
        <h2 id="settingsTitle">生成设置</h2>
        <div class="form-grid">
          <label>
            <span id="pageSizeLabel">页面尺寸</span>
            <select id="pageSize">
              <option value="image">跟随图片</option>
              <option value="a4-portrait">A4 纵向</option>
              <option value="a4-landscape">A4 横向</option>
            </select>
          </label>
          <label>
            <span id="fitModeLabel">适配方式</span>
            <select id="fitMode">
              <option value="contain">等比适应</option>
              <option value="cover">等比填充</option>
            </select>
          </label>
          <label>
            <span id="marginLabel">边距（pt）</span>
            <input id="marginInput" type="number" min="0" max="240" step="1" value="0">
          </label>
          <label>
            <span id="outputNameLabel">输出文件名</span>
            <input id="outputName" type="text" value="images.pdf">
          </label>
        </div>
        <button class="btn primary" id="generateButton" type="button">生成 PDF</button>
        <div class="status-line" id="statusLine">等待输入图片</div>
      </div>
    </section>

    <section class="workspace" style="margin-top:14px">
      <div class="card">
        <h2 id="outputTitle">输出</h2>
        <div class="summary" id="summary"></div>
        <div class="result-box" id="resultBox">暂无输出</div>
      </div>
      <div class="card">
        <h2 id="logTitle">日志</h2>
        <div class="log" id="logBox"></div>
      </div>
    </section>
  </main>

  <script src="./image-to-pdf.js"></script>
</body>
</html>
