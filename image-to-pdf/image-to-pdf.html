<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF 工具</title>
  <link rel="stylesheet" href="../shared-sortable.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("web-tools-theme") || localStorage.getItem("web-tool-theme");
        var theme = saved === "dark" || saved === "light"
          ? saved
          : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
    })();
  </script>
  <style>
    .tool-panel { display: none; }
    .tool-panel.active { display: grid; gap: 14px; }
    .file-list, .page-grid, .metadata-grid { display: grid; gap: 10px; }
    .file-item, .page-card, .metadata-row {
      border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 10px;
    }
    .file-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
    .file-item.sortable { grid-template-columns: auto minmax(0, 1fr) auto; }
    .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; }
    .page-grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
    .page-card { position: relative; display: grid; gap: 8px; }
    .thumb {
      position: relative; aspect-ratio: 3 / 4; display: grid; place-items: center; overflow: hidden;
      border: 1px solid var(--line); border-radius: 8px;
      background: linear-gradient(180deg, var(--panel), var(--soft)); color: var(--muted); font-weight: 900;
      width: 100%; padding: 0; cursor: zoom-in;
    }
    .thumb embed { width: 100%; height: 100%; border: 0; pointer-events: none; background: #fff; }
    .thumb-fallback { position: absolute; inset: auto 8px 8px; padding: 3px 6px; border-radius: 999px; background: color-mix(in srgb, var(--panel) 85%, transparent); color: var(--muted); font-size: 12px; }
    .page-card > .sort-handle {
      position: absolute; z-index: 2; top: 18px; right: 18px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      box-shadow: 0 2px 8px rgba(24, 32, 43, .14);
    }
    .preview-modal[hidden] { display: none; }
    .preview-modal {
      position: fixed; inset: 0; z-index: 20; display: grid; grid-template-rows: auto minmax(0, 1fr);
      gap: 10px; padding: 18px; background: rgba(5, 7, 13, .72);
    }
    .preview-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      width: min(980px, 100%); margin: 0 auto; color: #fff;
    }
    .preview-head strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preview-body {
      width: min(980px, 100%); min-height: 0; margin: 0 auto; border-radius: 8px; overflow: hidden; background: #fff;
    }
    .preview-body embed { width: 100%; height: 100%; border: 0; }
  </style>
  <link rel="stylesheet" href="../shared-controls.css">
</head>
<body class="wt-tool-page">
  <main class="shell">
    <nav class="topbar" aria-label="页面导航">
      <a class="home" href="../index.html">‹ <span id="homeLink">工具集</span></a>
      <div class="controls wt-top-actions">
        <span class="version-badge">V1.1.0</span>
        <div class="language" aria-label="Language">
          <button class="active" type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button class="theme-button" id="themeButton" type="button" aria-label="切换主题">◐</button>
      </div>
    </nav>

    <section class="hero">
      <div>
        <h1 id="pageTitle">PDF 工具</h1>
        <p class="lead" id="pageLead">在浏览器本地完成图片转 PDF、合并拆分、页面管理、水印页码和元数据清理。</p>
      </div>
      <div class="engine-card">
        <strong>pdf-lib</strong>
        <span id="engineStatus">尚未加载</span>
        <button class="btn" id="loadPdfLibButton" type="button">加载本地库</button>
      </div>
    </section>

    <nav class="tabs" aria-label="PDF 工具模式">
      <button class="active" type="button" data-tool="images">图片转 PDF</button>
      <button type="button" data-tool="merge">合并与拆分</button>
      <button type="button" data-tool="pages">页面管理</button>
      <button type="button" data-tool="watermark">水印与页码</button>
      <button type="button" data-tool="metadata">元数据清理</button>
    </nav>

    <section class="workspace">
      <div class="stack">
        <section class="card">
          <h2 id="inputTitle">输入文件</h2>
          <div class="tool-panel active" id="panel-images">
            <label class="upload" id="imageUpload">
              <input id="imageInput" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" multiple>
              <span><strong id="imageUploadTitle">选择或拖放 JPG/PNG 图片</strong><span id="imageUploadHint">支持多选；拖拽列表项可调整 PDF 页面顺序。</span></span>
            </label>
            <div class="file-list" id="imageList"></div>
          </div>

          <div class="tool-panel" id="panel-merge">
            <label class="upload" id="pdfUploadMerge">
              <input id="mergePdfInput" type="file" accept="application/pdf,.pdf" multiple>
              <span><strong id="pdfUploadTitle">选择或拖放 PDF 文件</strong><span id="pdfUploadHint">多个 PDF 会按列表顺序本地合并；拆分使用列表中的第一个 PDF。</span></span>
            </label>
            <div class="file-list" id="mergePdfList"></div>
          </div>

          <div class="tool-panel" id="panel-pages">
            <label class="upload" id="pdfUploadPages">
              <input id="pagesPdfInput" type="file" accept="application/pdf,.pdf" multiple>
              <span><strong id="pagesUploadTitle">选择 PDF 以管理页面</strong><span id="pagesUploadHint">导入后可拖拽排序、删除或旋转页面。</span></span>
            </label>
            <div class="page-grid" id="pageGrid"></div>
          </div>

          <div class="tool-panel" id="panel-watermark">
            <label class="upload" id="pdfUploadWatermark">
              <input id="watermarkPdfInput" type="file" accept="application/pdf,.pdf">
              <span><strong id="watermarkUploadTitle">选择要处理的 PDF</strong><span id="watermarkUploadHint">可添加文字水印、图片水印、页码、页眉和页脚。</span></span>
            </label>
            <div class="file-list" id="watermarkPdfList"></div>
          </div>

          <div class="tool-panel" id="panel-metadata">
            <label class="upload" id="pdfUploadMetadata">
              <input id="metadataPdfInput" type="file" accept="application/pdf,.pdf">
              <span><strong id="metadataUploadTitle">选择 PDF 查看元数据</strong><span id="metadataUploadHint">可查看并清除标题、作者、主题、关键词、创建工具等信息。</span></span>
            </label>
            <div class="metadata-grid" id="metadataList"></div>
          </div>
        </section>

        <section class="card">
          <h2 id="outputTitle">输出</h2>
          <div class="result-box" id="resultBox">暂无输出</div>
        </section>
      </div>

      <div class="stack">
        <section class="card">
          <h2 id="settingsTitle">处理设置</h2>
          <div class="tool-panel active" id="settings-images">
            <div class="form-grid">
              <label><span id="pageSizeLabel">页面尺寸</span><select id="pageSize"><option value="image">跟随图片</option><option value="a4-portrait">A4 纵向</option><option value="a4-landscape">A4 横向</option></select></label>
              <label><span id="fitModeLabel">适配方式</span><select id="fitMode"><option value="contain">等比适应</option><option value="cover">等比填充</option></select></label>
              <label><span id="marginLabel">边距（pt）</span><input id="marginInput" type="number" min="0" max="200" value="24"></label>
              <label><span id="imageOutputNameLabel">输出文件名</span><input id="imageOutputName" type="text" value="images.pdf"></label>
            </div>
            <div class="actions"><button class="btn primary" id="generateImagesButton" type="button">生成 PDF</button></div>
          </div>

          <div class="tool-panel" id="settings-merge">
            <div class="form-grid">
              <label><span id="rangeLabel">拆分页码范围</span><input id="splitRangeInput" type="text" placeholder="1-3,5"></label>
              <label><span id="mergeOutputNameLabel">输出文件名</span><input id="mergeOutputName" type="text" value="merged.pdf"></label>
            </div>
            <div class="actions">
              <button class="btn primary" id="mergeButton" type="button">合并 PDF</button>
              <button class="btn" id="splitButton" type="button">按范围拆分</button>
            </div>
          </div>

          <div class="tool-panel" id="settings-pages">
            <div class="form-grid">
              <label><span id="pagesOutputNameLabel">输出文件名</span><input id="pagesOutputName" type="text" value="managed.pdf"></label>
            </div>
            <div class="actions"><button class="btn primary" id="exportPagesButton" type="button">导出页面</button></div>
            <p class="muted" id="pagePreviewNote">缩略图显示页码、来源和旋转状态；所有页面操作都在本地完成。</p>
          </div>

          <div class="tool-panel" id="settings-watermark">
            <div class="form-grid">
              <label><span id="watermarkTextLabel">文字水印</span><input id="watermarkText" type="text" value=""></label>
              <label><span id="watermarkOpacityLabel">水印透明度</span><input id="watermarkOpacity" type="number" min="0.05" max="1" step="0.05" value="0.18"></label>
              <label><span id="pageNumberLabel">页码</span><select id="pageNumberMode"><option value="none">不添加</option><option value="bottom-center">底部居中</option><option value="bottom-right">底部右侧</option></select></label>
              <label><span id="watermarkOutputNameLabel">输出文件名</span><input id="watermarkOutputName" type="text" value="watermarked.pdf"></label>
            </div>
            <label><span id="imageWatermarkLabel">图片水印</span><input id="watermarkImageInput" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png"></label>
            <div class="form-grid">
              <label><span id="headerLabel">页眉</span><input id="headerText" type="text"></label>
              <label><span id="footerLabel">页脚</span><input id="footerText" type="text"></label>
            </div>
            <div class="actions"><button class="btn primary" id="applyWatermarkButton" type="button">应用水印与页码</button></div>
          </div>

          <div class="tool-panel" id="settings-metadata">
            <div class="form-grid">
              <label><span id="metadataOutputNameLabel">输出文件名</span><input id="metadataOutputName" type="text" value="cleaned.pdf"></label>
            </div>
            <div class="actions"><button class="btn primary" id="clearMetadataButton" type="button">清除元数据并导出</button></div>
          </div>

          <div class="status-line" id="statusLine">等待输入文件</div>
          <p class="resource-warning" id="resourceWarning">需要先在入口页资源管理中导入或下载 pdf-lib.min.js 到浏览器缓存。进入本页后仍需点击“加载本地库”或在处理时自动加载。</p>
        </section>
      </div>
    </section>
  </main>
  <div class="preview-modal" id="pagePreviewModal" hidden>
    <div class="preview-head">
      <strong id="pagePreviewTitle">PDF preview</strong>
      <button class="btn preview-close" id="pagePreviewClose" type="button">×</button>
    </div>
    <div class="preview-body">
      <embed id="pagePreviewEmbed" type="application/pdf">
    </div>
  </div>
  <script src="../shared-sortable.js"></script>
  <script src="../shared-controls.js"></script>
  <script src="./image-to-pdf.js"></script>
</body>
</html>
