<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF 工具</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("web-tools-theme") || localStorage.getItem("web-tool-theme");
        var theme = saved === "dark" || saved === "light"
          ? saved
          : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #18202b;
      --muted: #667085;
      --line: #d9dee7;
      --soft: #eef2f7;
      --blue: #2563eb;
      --green: #0f8f70;
      --amber: #b76e00;
      --danger: #c2410c;
      --shadow: 0 10px 28px rgba(24, 32, 43, .08);
      --ring: rgba(37, 99, 235, .18);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #05070d;
      --panel: #0d111a;
      --text: #f4f7fb;
      --muted: #96a1b3;
      --line: #202938;
      --soft: #111722;
      --blue: #8ab4ff;
      --green: #57d8b5;
      --amber: #f0b45b;
      --danger: #ff8a66;
      --shadow: 0 18px 46px rgba(0, 0, 0, .55);
      --ring: rgba(138, 180, 255, .22);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    button, input, select, textarea { font: inherit; }
    a { color: inherit; text-decoration: none; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 20px 0 44px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 52px; }
    .home, .btn, .icon-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text);
      cursor: pointer; font-weight: 700;
    }
    .home { min-height: 36px; padding: 7px 10px; color: var(--muted); }
    .btn { min-height: 38px; padding: 8px 12px; }
    .btn.primary { border-color: var(--blue); background: var(--blue); color: #fff; }
    :root[data-theme="dark"] .btn.primary { color: #07111f; }
    .home:hover, .btn:hover, .icon-btn:hover { border-color: var(--blue); color: var(--blue); }
    .btn.primary:hover { color: #fff; }
    :root[data-theme="dark"] .btn.primary:hover { color: #07111f; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .icon-btn { width: 36px; height: 36px; color: var(--muted); }
    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .language { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .language button, .theme-button {
      border: 0; border-radius: 6px; background: transparent; color: var(--muted);
      min-width: 36px; min-height: 30px; cursor: pointer; font-weight: 800;
    }
    .language button.active { background: var(--soft); color: var(--blue); }
    .theme-button { border: 1px solid var(--line); background: var(--panel); min-height: 38px; min-width: 40px; }
    .version-badge {
      display: inline-flex; align-items: center; justify-content: center; min-height: 38px; padding: 7px 11px;
      border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--muted);
      font-size: 13px; font-weight: 800;
    }
    .hero { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 22px; align-items: end; margin: 54px 0 20px; }
    h1 { margin: 0 0 8px; font-size: clamp(36px, 5vw, 54px); line-height: 1.02; letter-spacing: 0; }
    .lead { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.65; }
    .engine-card, .card { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: var(--shadow); }
    .engine-card { padding: 14px; display: grid; gap: 8px; }
    .engine-card strong { font-size: 13px; }
    .engine-card span, .muted { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .tabs { display: flex; gap: 6px; padding: 6px; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); overflow-x: auto; }
    .tabs button { border: 0; border-radius: 7px; background: transparent; color: var(--muted); min-height: 32px; padding: 6px 10px; cursor: pointer; white-space: nowrap; font-weight: 800; }
    .tabs button.active { background: var(--panel); color: var(--blue); box-shadow: 0 1px 5px rgba(24, 32, 43, .08); }
    .tool-panel { display: none; }
    .tool-panel.active { display: grid; gap: 14px; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(320px, .98fr); gap: 14px; }
    .stack { display: grid; gap: 14px; }
    .card { padding: 16px; min-width: 0; }
    .card h2 { margin: 0 0 14px; font-size: 18px; letter-spacing: 0; }
    .upload {
      display: grid; place-items: center; min-height: 124px; padding: 18px; border: 2px dashed var(--line);
      border-radius: 8px; background: var(--panel); color: var(--muted); text-align: center; cursor: pointer;
    }
    .upload strong { display: block; margin-bottom: 8px; color: var(--text); font-size: 16px; }
    .upload input { display: none; }
    .upload.dragover { border-color: var(--blue); background: var(--soft); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: end; }
    .form-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 700; }
    input, select, textarea {
      width: 100%; min-height: 38px; border: 1px solid var(--line); border-radius: 8px;
      padding: 8px 10px; background: var(--panel); color: var(--text); outline: 0;
    }
    textarea { min-height: 86px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 4px var(--ring); }
    .file-list, .page-grid, .metadata-grid { display: grid; gap: 10px; }
    .file-item, .page-card, .metadata-row {
      border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 10px;
    }
    .file-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
    .file-item.sortable { grid-template-columns: auto minmax(0, 1fr) auto; }
    .file-item.sortable, .page-card {
      transition: border-color .16s ease, box-shadow .16s ease, background-color .16s ease;
    }
    .file-item.sortable:hover, .page-card:hover { border-color: color-mix(in srgb, var(--blue) 48%, var(--line)); }
    .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; }
    .page-grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
    .page-card { position: relative; display: grid; gap: 8px; }
    .thumb {
      position: relative; aspect-ratio: 3 / 4; display: grid; place-items: center; overflow: hidden;
      border: 1px solid var(--line); border-radius: 8px;
      background: linear-gradient(180deg, var(--panel), var(--soft)); color: var(--muted); font-weight: 900;
      width: 100%; padding: 0; cursor: zoom-in;
    }
    .thumb embed { width: 100%; height: 100%; border: 0; pointer-events: none; background: #fff; }
    .thumb-fallback { position: absolute; inset: auto 8px 8px; padding: 3px 6px; border-radius: 999px; background: color-mix(in srgb, var(--panel) 85%, transparent); color: var(--muted); font-size: 12px; }
    .sort-handle {
      position: relative; width: 32px; height: 32px; flex: 0 0 32px; padding: 0;
      border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--muted);
      cursor: grab; touch-action: none;
    }
    .sort-handle::before {
      content: ""; position: absolute; width: 3px; height: 3px; border-radius: 50%; background: currentColor;
      left: 10px; top: 8px; box-shadow: 0 6px currentColor, 0 12px currentColor, 7px 0 currentColor, 7px 6px currentColor, 7px 12px currentColor;
    }
    .sort-handle:hover, .sort-handle:focus-visible { border-color: var(--blue); color: var(--blue); box-shadow: 0 0 0 4px var(--ring); outline: 0; }
    .sort-handle:active { cursor: grabbing; transform: translateY(1px); }
    .page-card > .sort-handle {
      position: absolute; z-index: 2; top: 18px; right: 18px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      box-shadow: 0 2px 8px rgba(24, 32, 43, .14);
    }
    .sortable-container.is-sorting { user-select: none; }
    .sort-placeholder {
      position: relative; border: 2px dashed var(--blue);
      background: color-mix(in srgb, var(--blue) 8%, var(--panel));
      box-shadow: inset 0 0 0 3px var(--ring);
    }
    .sort-placeholder > * { visibility: hidden; }
    .sort-placeholder::after {
      content: attr(data-drop-label); position: absolute; inset: 0; display: grid; place-items: center;
      padding: 12px; color: var(--blue); text-align: center; font-size: 12px; font-weight: 800;
    }
    .sort-ghost {
      position: fixed; z-index: 50; margin: 0; pointer-events: none; opacity: .94;
      border-color: var(--blue); box-shadow: 0 18px 42px rgba(24, 32, 43, .24), 0 0 0 4px var(--ring);
      transform: rotate(1.5deg) scale(1.02); will-change: left, top;
    }
    .sort-ghost .sort-handle, .sort-ghost .page-actions, .sort-ghost > .icon-btn { display: none; }
    .sort-ghost .thumb { cursor: default; }
    html.is-sorting, html.is-sorting * { cursor: grabbing !important; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .page-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .page-actions .btn { min-height: 32px; padding: 5px 8px; font-size: 12px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .status-line { margin-top: 12px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .result-box { min-height: 100px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); color: var(--muted); overflow: auto; line-height: 1.6; }
    .result-box a { display: inline-flex; align-items: center; justify-content: center; min-height: 38px; padding: 8px 12px; border-radius: 8px; background: var(--green); color: #fff; font-weight: 800; }
    :root[data-theme="dark"] .result-box a { color: #04110d; }
    .resource-warning { padding: 10px 12px; border-left: 4px solid var(--amber); border-radius: 8px; background: color-mix(in srgb, var(--amber) 12%, var(--panel)); color: var(--muted); font-size: 13px; line-height: 1.6; }
    .preview-modal[hidden] { display: none; }
    .preview-modal {
      position: fixed; inset: 0; z-index: 20; display: grid; grid-template-rows: auto minmax(0, 1fr);
      gap: 10px; padding: 18px; background: rgba(5, 7, 13, .72);
    }
    .preview-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      width: min(980px, 100%); margin: 0 auto; color: #fff;
    }
    .preview-head strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preview-close { background: #fff; color: #18202b; }
    .preview-body {
      width: min(980px, 100%); min-height: 0; margin: 0 auto; border-radius: 8px; overflow: hidden; background: #fff;
    }
    .preview-body embed { width: 100%; height: 100%; border: 0; }
    @media (max-width: 860px) {
      .hero, .workspace, .form-grid, .form-grid.three { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar" aria-label="页面导航">
      <a class="home" href="../index.html">‹ <span id="homeLink">工具集</span></a>
      <div class="controls">
        <span class="version-badge">V1.1.0</span>
        <div class="language" aria-label="Language">
          <button class="active" type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button class="theme-button" id="themeButton" type="button" aria-label="切换主题">◐</button>
      </div>
    </nav>

    <section class="hero">
      <div>
        <h1 id="pageTitle">PDF 工具</h1>
        <p class="lead" id="pageLead">在浏览器本地完成图片转 PDF、合并拆分、页面管理、水印页码和元数据清理。</p>
      </div>
      <div class="engine-card">
        <strong>pdf-lib</strong>
        <span id="engineStatus">尚未加载</span>
        <button class="btn" id="loadPdfLibButton" type="button">加载本地库</button>
      </div>
    </section>

    <nav class="tabs" aria-label="PDF 工具模式">
      <button class="active" type="button" data-tool="images">图片转 PDF</button>
      <button type="button" data-tool="merge">合并与拆分</button>
      <button type="button" data-tool="pages">页面管理</button>
      <button type="button" data-tool="watermark">水印与页码</button>
      <button type="button" data-tool="metadata">元数据清理</button>
    </nav>

    <section class="workspace">
      <div class="stack">
        <section class="card">
          <h2 id="inputTitle">输入文件</h2>
          <div class="tool-panel active" id="panel-images">
            <label class="upload" id="imageUpload">
              <input id="imageInput" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" multiple>
              <span><strong id="imageUploadTitle">选择或拖放 JPG/PNG 图片</strong><span id="imageUploadHint">支持多选；拖拽列表项可调整 PDF 页面顺序。</span></span>
            </label>
            <div class="file-list" id="imageList"></div>
          </div>

          <div class="tool-panel" id="panel-merge">
            <label class="upload" id="pdfUploadMerge">
              <input id="mergePdfInput" type="file" accept="application/pdf,.pdf" multiple>
              <span><strong id="pdfUploadTitle">选择或拖放 PDF 文件</strong><span id="pdfUploadHint">多个 PDF 会按列表顺序本地合并；拆分使用列表中的第一个 PDF。</span></span>
            </label>
            <div class="file-list" id="mergePdfList"></div>
          </div>

          <div class="tool-panel" id="panel-pages">
            <label class="upload" id="pdfUploadPages">
              <input id="pagesPdfInput" type="file" accept="application/pdf,.pdf" multiple>
              <span><strong id="pagesUploadTitle">选择 PDF 以管理页面</strong><span id="pagesUploadHint">导入后可拖拽排序、删除或旋转页面。</span></span>
            </label>
            <div class="page-grid" id="pageGrid"></div>
          </div>

          <div class="tool-panel" id="panel-watermark">
            <label class="upload" id="pdfUploadWatermark">
              <input id="watermarkPdfInput" type="file" accept="application/pdf,.pdf">
              <span><strong id="watermarkUploadTitle">选择要处理的 PDF</strong><span id="watermarkUploadHint">可添加文字水印、图片水印、页码、页眉和页脚。</span></span>
            </label>
            <div class="file-list" id="watermarkPdfList"></div>
          </div>

          <div class="tool-panel" id="panel-metadata">
            <label class="upload" id="pdfUploadMetadata">
              <input id="metadataPdfInput" type="file" accept="application/pdf,.pdf">
              <span><strong id="metadataUploadTitle">选择 PDF 查看元数据</strong><span id="metadataUploadHint">可查看并清除标题、作者、主题、关键词、创建工具等信息。</span></span>
            </label>
            <div class="metadata-grid" id="metadataList"></div>
          </div>
          <p class="sr-only" id="sortStatus" aria-live="polite"></p>
        </section>

        <section class="card">
          <h2 id="outputTitle">输出</h2>
          <div class="result-box" id="resultBox">暂无输出</div>
        </section>
      </div>

      <div class="stack">
        <section class="card">
          <h2 id="settingsTitle">处理设置</h2>
          <div class="tool-panel active" id="settings-images">
            <div class="form-grid">
              <label><span id="pageSizeLabel">页面尺寸</span><select id="pageSize"><option value="image">跟随图片</option><option value="a4-portrait">A4 纵向</option><option value="a4-landscape">A4 横向</option></select></label>
              <label><span id="fitModeLabel">适配方式</span><select id="fitMode"><option value="contain">等比适应</option><option value="cover">等比填充</option></select></label>
              <label><span id="marginLabel">边距（pt）</span><input id="marginInput" type="number" min="0" max="200" value="24"></label>
              <label><span id="imageOutputNameLabel">输出文件名</span><input id="imageOutputName" type="text" value="images.pdf"></label>
            </div>
            <div class="actions"><button class="btn primary" id="generateImagesButton" type="button">生成 PDF</button></div>
          </div>

          <div class="tool-panel" id="settings-merge">
            <div class="form-grid">
              <label><span id="rangeLabel">拆分页码范围</span><input id="splitRangeInput" type="text" placeholder="1-3,5"></label>
              <label><span id="mergeOutputNameLabel">输出文件名</span><input id="mergeOutputName" type="text" value="merged.pdf"></label>
            </div>
            <div class="actions">
              <button class="btn primary" id="mergeButton" type="button">合并 PDF</button>
              <button class="btn" id="splitButton" type="button">按范围拆分</button>
            </div>
          </div>

          <div class="tool-panel" id="settings-pages">
            <div class="form-grid">
              <label><span id="pagesOutputNameLabel">输出文件名</span><input id="pagesOutputName" type="text" value="managed.pdf"></label>
            </div>
            <div class="actions"><button class="btn primary" id="exportPagesButton" type="button">导出页面</button></div>
            <p class="muted" id="pagePreviewNote">缩略图显示页码、来源和旋转状态；所有页面操作都在本地完成。</p>
          </div>

          <div class="tool-panel" id="settings-watermark">
            <div class="form-grid">
              <label><span id="watermarkTextLabel">文字水印</span><input id="watermarkText" type="text" value=""></label>
              <label><span id="watermarkOpacityLabel">水印透明度</span><input id="watermarkOpacity" type="number" min="0.05" max="1" step="0.05" value="0.18"></label>
              <label><span id="pageNumberLabel">页码</span><select id="pageNumberMode"><option value="none">不添加</option><option value="bottom-center">底部居中</option><option value="bottom-right">底部右侧</option></select></label>
              <label><span id="watermarkOutputNameLabel">输出文件名</span><input id="watermarkOutputName" type="text" value="watermarked.pdf"></label>
            </div>
            <label><span id="imageWatermarkLabel">图片水印</span><input id="watermarkImageInput" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png"></label>
            <div class="form-grid">
              <label><span id="headerLabel">页眉</span><input id="headerText" type="text"></label>
              <label><span id="footerLabel">页脚</span><input id="footerText" type="text"></label>
            </div>
            <div class="actions"><button class="btn primary" id="applyWatermarkButton" type="button">应用水印与页码</button></div>
          </div>

          <div class="tool-panel" id="settings-metadata">
            <div class="form-grid">
              <label><span id="metadataOutputNameLabel">输出文件名</span><input id="metadataOutputName" type="text" value="cleaned.pdf"></label>
            </div>
            <div class="actions"><button class="btn primary" id="clearMetadataButton" type="button">清除元数据并导出</button></div>
          </div>

          <div class="status-line" id="statusLine">等待输入文件</div>
          <p class="resource-warning" id="resourceWarning">需要先在入口页资源管理中导入或下载 pdf-lib.min.js 到浏览器缓存。进入本页后仍需点击“加载本地库”或在处理时自动加载。</p>
        </section>
      </div>
    </section>
  </main>
  <div class="preview-modal" id="pagePreviewModal" hidden>
    <div class="preview-head">
      <strong id="pagePreviewTitle">PDF preview</strong>
      <button class="btn preview-close" id="pagePreviewClose" type="button">×</button>
    </div>
    <div class="preview-body">
      <embed id="pagePreviewEmbed" type="application/pdf">
    </div>
  </div>
  <script src="./image-to-pdf.js"></script>
</body>
</html>
